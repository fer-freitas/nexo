[project]
name = "nexo"
version = "0.1.0"
description = "Nexo: do pedido ao PR, por papel, com portões determinísticos"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "keyring>=25",
  "cryptography>=43",
  "markitdown[docx,pdf,pptx,xlsx]>=0.1",
  "openapi-spec-validator>=0.7",
  "jsonschema>=4.23",
  "prompt-toolkit>=3.0.48",
  "platformdirs>=4",
]

[project.scripts]
nexo = "nexo.cli.main:run"

[project.optional-dependencies]
build = ["pyinstaller>=6"]
media = ["faster-whisper>=1.1"]
central = ["fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2", "pyarrow>=17"]
dev = [
  "pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.8", "hypothesis>=6", "mypy>=1.11", "ruff>=0.6",
  "import-linter>=2.1", "pip-audit>=2.7", "types-jsonschema", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30",
  "pyarrow>=17", "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S311", "RUF059", "E501", "F811"]
"scripts/**" = ["S101", "RUF059", "RUF012"]
"src/nexo/kernel/i18n/messages.py" = ["E501"]
"src/nexo/central/*.py" = ["S608", "E501"]  # HTML e SQL em texto
"src/nexo/central/app/portal.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nexo"]

[[tool.mypy.overrides]]
module = ["keyring.*", "faster_whisper.*", "markitdown.*", "openapi_spec_validator.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]
markers = ["slow: testes lentos"]

[tool.coverage.run]
source = ["nexo"]
branch = true
