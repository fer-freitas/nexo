id: lineage
version: 1.0.0
title: "Linhagem de componentes"
flags:
  - key: lineage.read
    title: "Linhagem: consulta do mapa de componentes"
    area: "Linhagem de componentes"
    stage: beta
    commands:
      - "lineage show"
      - "lineage upstream"
      - "lineage downstream"
      - "lineage impact"
      - "lineage coverage"
      - "lineage export"
      - "lineage notify"
      - "lineage validate"
      - "lineage confirm"
      - "lineage sync"
      - "lineage agent"
  - key: lineage.scan
    title: "Linhagem: geração do manifesto"
    area: "Linhagem de componentes"
    stage: beta
    commands: ["lineage scan"]
  - key: lineage.publish
    title: "Linhagem: publicação no repositório do time"
    area: "Linhagem de componentes"
    stage: beta
    commands: ["lineage publish"]
  - key: lineage.discover
    title: "Linhagem: descoberta pela AWS e pelo Kafka"
    area: "Linhagem de componentes"
    stage: experimental
    default: false
    commands: ["lineage discover"]
  - key: lineage.gate
    title: "Linhagem: mudança de contrato vai para decisão humana"
    area: "Linhagem de componentes"
    stage: experimental
    default: false
cli: "nexo.modules.lineage.cli:register"
services:
  lineage.app: "nexo.modules.lineage.app.lineage"
  lineage.changes: "nexo.modules.lineage.app.changes"
commands:
  - {path: "lineage", summary: "De onde vem e para onde vai cada componente"}
