id: setup
version: 1.0.0
title: "Instalação e diagnóstico"
flags:
  - key: guard
    title: "Guarda do Nexo nas sessões de IA fora do Nexo"
    area: "Segurança"
    commands: ["guard install"]
  - key: monitor
    title: "Monitor sintético das CLIs"
    area: "Qualidade"
    commands: ["monitor"]
  - key: traces
    title: "Traces OpenTelemetry para o APM"
    area: "Observabilidade"
  - key: transcripts
    title: "Replay redigido das sessões do agente"
    area: "Observabilidade"
cli: "nexo.modules.setup.cli:register"
commands:
  - {path: "setup", summary: "Confere e instala o que é preciso para rodar", kind: write}
  - {path: "squad", summary: "De qual squad você participa", kind: write}
  - {path: "central", summary: "Liga esta máquina ao coletor central da empresa", kind: write}
  - {path: "flags", summary: "Funcionalidades ligadas e de onde vem cada valor"}
  - {path: "module", summary: "Módulos do Nexo"}
  - {path: "init", summary: "Prepara o repositório", kind: write}
  - {path: "doctor", summary: "O que falta nesta máquina"}
  - {path: "login", summary: "Credenciais no cofre do sistema", kind: write}
services:
  setup.banner: "nexo.modules.setup.app.banner"
  setup.project: "nexo.modules.setup.app.project"
