# Identidade visual do Nexo: o dashboard e o console leem as cores, as fontes e o nome daqui.
#
# Paleta inspirada na identidade pública do Itaú Unibanco. Os valores NÃO vêm do manual oficial de marca, que não é
# público: o laranja é o usado publicamente, e os demais são aproximações. Confirmar com o time de marca. A fonte
# própria e o logo da empresa não estão aqui: dependem de liberação e entram por um `brand.yaml` no cérebro.
#
# Para trocar a marca, não edite este arquivo. Crie um `brand.yaml` só com o que muda:
#   - no cérebro da org (raiz do nexo-brain): vale para o console de todo mundo;
#   - no coletor central: aponte `NX_BRAND=/caminho/brand.yaml` (vale para o dashboard).
# Chaves ausentes herdam daqui. Cores em hexadecimal (#RRGGBB).
#
# Papéis das cores:
#   accent     destaque da marca (links, item ativo, barras dos gráficos)
#   good/warn/bad  estado (bom, atenção, problema); não use a cor da marca para estado
#   *_soft     fundo claro do selo de cada cor
#   bg/surface/surface_2/line  fundo da página, cartões, faixas e linhas
#   text/muted/faint  texto principal, secundário e terciário

name: Nexo

fonts:
  sans: '"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif'
  mono: 'ui-monospace, Consolas, "SF Mono", Menlo, monospace'

light:
  bg: "#FAFAF8"
  surface: "#FFFFFF"
  surface_2: "#FFF4EA"
  line: "#E6E2DA"
  text: "#14213D"
  muted: "#56607A"
  faint: "#808899"
  accent: "#BF5600"
  accent_soft: "#FDE9D7"
  on_accent: "#FFFFFF"
  good: "#1F8F62"
  good_soft: "#DFF3EA"
  warn: "#A86A00"
  warn_soft: "#FBF0D9"
  bad: "#C2372F"
  bad_soft: "#FBE3E1"

dark:
  bg: "#0F1A3D"
  surface: "#16244F"
  surface_2: "#1C2B6B"
  line: "#2C3C78"
  text: "#F2F4FA"
  muted: "#AEB8D2"
  faint: "#8491B3"
  accent: "#FF8A1F"
  accent_soft: "#3A2A22"
  on_accent: "#0F1A3D"
  good: "#45C08A"
  good_soft: "#12301F"
  warn: "#E2B04A"
  warn_soft: "#33270F"
  bad: "#F07167"
  bad_soft: "#3A1714"

# Console: cores que funcionam em terminal claro e escuro (o terminal não diz qual é o fundo).
terminal:
  accent: "#EC7000"
  good: "#2FAE73"
  warn: "#D69A1E"
  bad: "#E5534B"
