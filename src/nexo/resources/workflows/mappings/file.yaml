# De-para padrão para troca por arquivo (CSV), em nomes neutros. Ajuste aos nomes da ferramenta do time em
# nexo-brain/workflows/mappings/file.yaml ou em .nexo/mappings/file.yaml do repositório.
tracker: file
types: {epic: Epic, feature: Feature, story: Story, task: Task, bug: Bug}
states:
  Ideia:            {state: To Do}
  Refinamento:      {state: To Do, tags: [nexo-refinement]}
  Pronto:           {state: To Do, tags: [nexo-ready]}
  EmDev:            {state: In Progress}
  EmQA:             {state: In Progress, tags: [nexo-qa]}
  EmReview:         {state: In Review}
  AguardandoHumano: {state: In Review, tags: [nexo-human-gate]}
  Concluido:        {state: Done}
  Bloqueado:        {keep_state: true, tags: [nexo-blocked]}
  Escalado:         {keep_state: true, tags: [nexo-escalated]}
  Cancelado:        {state: Cancelled}
reverse: {To Do: Pronto, In Progress: EmDev, In Review: EmReview, Done: Concluido, Cancelled: Cancelado}
